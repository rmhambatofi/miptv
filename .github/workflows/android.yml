name: Android phone
on:
  push:
    branches: [main, feature/initial-android-phone]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      # The shared signing key, so the CI APK updates an app installed from a computer. Secrets never reach
      # pull requests from forks: their build falls back to a throwaway debug key.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MIPTV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/miptv.jks"
            echo "MIPTV_KEYSTORE_FILE=$RUNNER_TEMP/miptv.jks" >> "$GITHUB_ENV"
          else
            echo "No MIPTV_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key."
          fi
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
        env:
          MIPTV_KEYSTORE_PASSWORD: ${{ secrets.MIPTV_KEYSTORE_PASSWORD }}
          MIPTV_KEY_ALIAS: ${{ secrets.MIPTV_KEY_ALIAS }}
          MIPTV_KEY_PASSWORD: ${{ secrets.MIPTV_KEY_PASSWORD }}
      - name: Room schema is committed
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            git status --porcelain -- app/schemas
            echo 'Room schema changed: commit app/schemas.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-phone-build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
