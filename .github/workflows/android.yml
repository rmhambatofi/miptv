name: Android phone
on:
  push:
    branches: [main, feature/initial-android-phone, diag/emulator-offline]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Room schema is committed
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            git status --porcelain -- app/schemas
            echo 'Room schema changed: commit app/schemas.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-phone-build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
  touch-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and test APKs before the emulator starts
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - name: Install gdb for the freeze snapshot
        run: sudo apt-get install -y -qq gdb > /dev/null
      - name: Watch host memory and the emulator process every second
        run: |
          mkdir -p app/build/reports/androidTests
          nohup .github/diag/host-watch.sh > app/build/reports/androidTests/host.txt 2>&1 &
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          cores: 3
          ram-size: 4096M
          disable-animations: true
          script: |
            mkdir -p app/build/reports/androidTests
            adb logcat -c
            nohup adb logcat -v threadtime > app/build/reports/androidTests/logcat.txt 2>&1 &
            nohup .github/diag/freeze-watch.sh app/build/reports/androidTests/freeze.txt > /dev/null 2>&1 &
            ./gradlew connectedDebugAndroidTest
      - name: Why the emulator stopped
        if: always()
        run: |
          D=app/build/reports/androidTests
          sudo dmesg -T > $D/host-dmesg.txt 2>&1 || true
          grep -iE "oom|killed process|out of memory|segfault|qemu|trap|general protection|kvm" $D/host-dmesg.txt | tail -40 || true
          ps aux | grep -i [q]emu || echo "no emulator process left"
          free -m; nproc; uptime
          ls -la /tmp/android-runner/ /tmp/android-$USER/ ~/.android/ 2>/dev/null || true
          find /tmp /home/runner/.android -maxdepth 3 \( -name "*crash*" -o -name "*.dmp" -o -name "core*" \) 2>/dev/null | head -20
          mkdir -p $D/emu-crash && cp -r /tmp/android-runner/* $D/emu-crash/ 2>/dev/null || true
          tail -15 $D/host.txt
          sleep 20
          head -60 $D/freeze.txt 2>/dev/null || echo "no freeze snapshot"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-phone-touch-tests-${{ matrix.attempt }}
          path: app/build/reports/androidTests/
